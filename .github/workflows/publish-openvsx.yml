name: Publish to Open VSX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openvsx
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package -- --out stackhub.vsix
      - name: Publish package
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || { echo 'OVSX_PAT is missing'; exit 1; }
          npx --yes ovsx@1.3.0 publish stackhub.vsix -p "$OVSX_PAT"
